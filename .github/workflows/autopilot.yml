name: 24/7 AutoPilot YouTube Shorts Bot

on:
  schedule:
    # Trigger automatically every 30 minutes in GitHub Cloud
    - cron: '*/30 * * * *'
  workflow_dispatch: # Can also be triggered via cron-job.org API dispatch

jobs:
  clip_and_upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Cloudflare WARP (Bypass Cloud Datacenter Bot Checks)
        continue-on-error: true
        timeout-minutes: 2
        uses: fscarmen/warp-on-actions@v1.4
        with:
          stack: dual
          mode: wireguard

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Deno (YouTube Signature JS Runtime)
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Fast System & Fonts Setup
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core

      - name: Install Python Packages
        run: |
          pip install --no-cache-dir yt-dlp bgutil-ytdlp-pot-provider google-api-python-client google-auth-oauthlib google-auth faster-whisper

      - name: Start YouTube BotGuard PO-Token Provider (Cloud Anti-Bot Bypass)
        continue-on-error: true
        run: |
          docker run --name bgutil-provider -d -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider:latest
          sleep 5

      - name: Run Cloud AutoPilot Clipper & Uploader
        env:
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: |
          cd backend
          python cloud_runner.py

      - name: Clean sensitive credentials before finish
        if: always()
        run: |
          rm -f backend/client_secret.json backend/youtube_token.json
