name: 24/7 AutoPilot YouTube Shorts Bot

on:
  schedule:
    # Trigger automatically every 30 minutes in GitHub Cloud
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      video_id:
        description: 'Specific YouTube Video or Stream ID to clip'
        required: false
        type: string
        default: ''

jobs:
  clip_and_upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Deno (YouTube Signature JS Runtime)
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Install FFmpeg & System Dependencies
        timeout-minutes: 10
        run: |
          if ! command -v ffmpeg &> /dev/null; then
            echo "Installing FFmpeg..."
            sudo systemctl stop unattended-upgrades 2>/dev/null || true
            sudo killall -9 apt apt-get unattended-upgrade 2>/dev/null || true
            sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock /var/lib/dpkg/lock* 2>/dev/null || true
            sudo dpkg --configure -a 2>/dev/null || true
            sudo apt-get update -qq -o Acquire::http::Timeout=20
            sudo apt-get install -y --no-install-recommends -o Acquire::http::Timeout=30 -o Acquire::Retries=3 ffmpeg fonts-dejavu-core
          else
            echo "FFmpeg already installed: $(ffmpeg -version | head -n 1)"
          fi

      - name: Setup Cloudflare WARP SOCKS5 Proxy (Datacenter Anti-Bot Bypass)
        continue-on-error: true
        uses: fscarmen/warp-on-actions@v1.4
        with:
          stack: ipv4
          mode: client

      - name: Install Python Packages
        timeout-minutes: 6
        run: |
          pip install --no-cache-dir yt-dlp google-api-python-client google-auth-oauthlib google-auth faster-whisper

      - name: Run Cloud AutoPilot Clipper & Uploader
        timeout-minutes: 10
        env:
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          TARGET_VIDEO_ID: ${{ inputs.video_id }}
        run: |
          cd backend
          python cloud_runner.py

      - name: Clean sensitive credentials before finish
        if: always()
        run: |
          rm -f backend/client_secret.json backend/youtube_token.json
