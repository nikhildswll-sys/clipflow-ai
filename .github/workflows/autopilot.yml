name: 24/7 AutoPilot YouTube Shorts Bot

on:
  schedule:
    # Trigger automatically every 30 minutes in GitHub Cloud
    - cron: '*/30 * * * *'
  workflow_dispatch: # Can also be triggered via cron-job.org API dispatch

jobs:
  clip_and_upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp google-api-python-client google-auth-oauthlib google-auth

      - name: Run Cloud AutoPilot Clipper & Uploader
        env:
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: |
          cd backend
          python cloud_runner.py
