name: 24/7 AutoPilot YouTube Shorts Bot

on:
  schedule:
    # Trigger automatically every 30 minutes in GitHub Cloud
    - cron: '*/30 * * * *'
  workflow_dispatch: # Can also be triggered via cron-job.org API dispatch

jobs:
  clip_and_upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Deno (YouTube Signature JS Runtime)
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Install FFmpeg & Fonts
        timeout-minutes: 2
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core

      - name: Install Python Packages
        timeout-minutes: 3
        run: |
          pip install --no-cache-dir yt-dlp "bgutil-ytdlp-pot-provider==0.8.1" google-api-python-client google-auth-oauthlib google-auth faster-whisper

      - name: Start YouTube BotGuard PO-Token Provider (Cloud Anti-Bot Bypass)
        timeout-minutes: 2
        continue-on-error: true
        run: |
          wget -q --timeout=15 https://github.com/jim60105/bgutil-ytdlp-pot-provider-rs/releases/latest/download/bgutil-pot-linux-x86_64 -O bgutil-pot
          chmod +x bgutil-pot
          ./bgutil-pot server --host 127.0.0.1 --port 4416 &
          sleep 2

      - name: Run Cloud AutoPilot Clipper & Uploader
        timeout-minutes: 6
        env:
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: |
          cd backend
          python cloud_runner.py

      - name: Clean sensitive credentials before finish
        if: always()
        run: |
          rm -f backend/client_secret.json backend/youtube_token.json
