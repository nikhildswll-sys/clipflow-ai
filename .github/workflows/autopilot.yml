name: 24/7 AutoPilot YouTube Shorts Bot

on:
  schedule:
    # Trigger automatically every 30 minutes in GitHub Cloud
    - cron: '*/30 * * * *'
  workflow_dispatch: # Can also be triggered via cron-job.org API dispatch

jobs:
  clip_and_upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Deno (YouTube Signature JS Runtime)
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Install Native FFmpeg & Fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core

      - name: Setup Cloudflare WARP SOCKS5 Proxy (Datacenter Anti-Bot Bypass)
        continue-on-error: true
        uses: fscarmen/warp-on-actions@v1.4
        with:
          stack: ipv4
          mode: client

      - name: Install Python Packages
        timeout-minutes: 3
        run: |
          pip install --no-cache-dir yt-dlp google-api-python-client google-auth-oauthlib google-auth faster-whisper

      - name: Run Cloud AutoPilot Clipper & Uploader
        timeout-minutes: 6
        env:
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: |
          cd backend
          python cloud_runner.py

      - name: Clean sensitive credentials before finish
        if: always()
        run: |
          rm -f backend/client_secret.json backend/youtube_token.json
