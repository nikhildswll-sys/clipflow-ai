name: 24/7 AutoPilot YouTube Shorts Bot

on:
  workflow_dispatch: # Controlled by external cron (every 4 hours) or manual trigger
    inputs:
      video_id:
        description: 'Specific YouTube Video or Stream ID to clip'
        required: false
        type: string
        default: ''

jobs:
  clip_and_upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Deno (YouTube Signature JS Runtime)
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Setup Cloudflare WARP SOCKS5 Proxy (Datacenter Anti-Bot Bypass)
        continue-on-error: true
        timeout-minutes: 2
        uses: fscarmen/warp-on-actions@v1.4
        with:
          stack: ipv4
          mode: client

      - name: Install Python Packages
        timeout-minutes: 6
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir --upgrade "yt-dlp[default]" google-api-python-client google-auth-oauthlib google-auth faster-whisper

      - name: Run Cloud AutoPilot Clipper & Uploader
        timeout-minutes: 10
        env:
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          TARGET_VIDEO_ID: ${{ inputs.video_id }}
        run: |
          cd backend
          python cloud_runner.py

      - name: Clean sensitive credentials before finish
        if: always()
        run: |
          rm -f backend/client_secret.json backend/youtube_token.json
